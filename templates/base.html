{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kitunga AI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="kitunga-nav">
    <a class="brand-lockup" href="{% url 'dashboard:dashboard' %}">
      <span class="brand-mark">KA</span>
      <span>
        <strong>Kitunga AI</strong>
        <small>Panier intelligent Fab Lab</small>
      </span>
    </a>
    <div class="nav-actions">
      <a href="{% url 'dashboard:dashboard' %}">Dashboard</a>
      <a href="/admin/">Admin</a>
      <a href="/api/products/">API produits</a>
    </div>
  </nav>

  {% if messages %}
    <div class="message-stack">
      {% for message in messages %}
        <div class="kitunga-alert kitunga-alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
